[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    mikalhart/TinyGPSPlus@^1.0.3

build_flags =
    -D USER_SETUP_LOADED=1
    ; Display on HSPI so the MicroSD slot can have VSPI
    -D USE_HSPI_PORT=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SPI_FREQUENCY=55000000
; src/w5/ is the 5" board's code
build_src_filter = +<*> -<w5/>

; Waveshare ESP32-S3-Touch-LCD-5 (800x480 RGB panel, GT911 touch, onboard
; CAN transceiver). Upload over its USB-C port.
[env:waveshare5]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    mikalhart/TinyGPSPlus@^1.0.3
build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_W5
    ; Serial goes over the USB-C port
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Its own code in src/w5/, plus the CAN and SD logging shared with the CYD
build_src_filter = -<*> +<w5/> +<can_bus.cpp> +<sd_log.cpp>

; Host-side unit tests for pure dashboard logic: pio test -e native
[env:native]
platform = native
test_framework = unity
